# xss-payloads.yaml - shared XSS probe corpus for the Critic family, v2.
# Run, do not eyeball: where a review can execute the target's sanitizer
# configuration (a Node runtime for the JS stacks, a test harness for the
# server stacks), every payload goes through it, and the outcome is the
# evidence. The fixed rule for every payload in an attack class: the
# payload's executable content must be gone or inert in the output.
# Benign-control entries carry the opposite rule: their structure must
# SURVIVE, and over-stripping is a defect of the opposite sign.
# v2 is the full DOMPurify test-suite extraction, merged with the v1
# curated entries (ids XSS-README-* and XSS-CLASS-*, kept verbatim).
# Extraction: extract-corpus.mjs over a clone of cure53/DOMPurify at
# commit b7e0edc1293359d6ab54dc0ccc9cf9bbdd72aff7 (DOMPurify 3.4.17), extracted 2026-10-29:
# 562 payload occurrences scanned in test/fixtures/expect.mjs and inline
# sanitize() calls in test/*.js, 402 unique payloads,
# 3 payload(s) already present in v1 (provenance merged into
# the v1 entry), 413 entries total in this file.
# Entries carry per-entry provenance in source_file (v1 entries predate
# per-file provenance; their source is the DOMPurify README and attack
# class catalog, read 2026-10-28). Class names are the v1 taxonomy plus
# one declared extension, script-element, for the bare script primitive
# upstream tests heavily. 5 iframe and object embed payloads remain
# class unclassified; their invariant is the generic one.
# Entries are reproduced from the DOMPurify test suite under Apache-2.0
# (DOMPurify is dual licensed Apache-2.0 or MPL-2.0; the family takes
# Apache-2.0, consistent with THIRD-PARTY.md handling).
# Quick mode gates run entries with core: true (all v1 entries plus the
# strongest representatives per class); full mode runs every entry.
# Carries verified_as_of and expires 90 days later under the staleness
# law (SOUL 8.15); the extraction should be re-run on each DOMPurify
# minor release and this file re-issued.
version: 2
verified_as_of: '2026-10-29'
expires: '2027-01-27'
source: cure53/DOMPurify test suite at commit b7e0edc1293359d6ab54dc0ccc9cf9bbdd72aff7 (DOMPurify 3.4.17), extracted 2026-10-29 with extract-corpus.mjs, merged with the v1 curated corpus (DOMPurify README samples and attack-class catalog, read 2026-10-28)
entry_count: 413
class_counts:
  benign-control: 148
  details-event: 1
  dom-clobbering: 20
  event-handler-basic: 41
  form-action-scheme: 3
  mathml-injection-point: 9
  mutation-xss-namespace: 18
  nesting-structure: 38
  rawtext-breakout: 29
  script-element: 39
  srcdoc: 1
  svg-event-handler: 13
  template-content: 10
  unclassified: 5
  unclosed-tag-injection: 1
  uri-scheme: 37
entries:
- id: XSS-README-001
  class: nesting-structure
  payload: <div id="x">a=1</div>
  expect: Purified output keeps the div empty or text-only; the assignment text a=1 must not survive as markup or script-capable content.
  core: true
- id: XSS-README-002
  class: svg-event-handler
  payload: <svg><animate onbegin=alert(1) attributeName=x dur=1s>
  expect: The onbegin handler is removed; no event attribute survives.
  core: true
- id: XSS-README-003
  class: dom-clobbering
  payload: <form><math><mtext></form><form><mglyph><style></math><img src onerror=alert(1)>
  expect: No onerror survives; the clobbering form and math structure does not re-form an executable img handler after a browser parse.
  core: true
- id: XSS-README-004
  class: unclosed-tag-injection
  payload: <hello<
  expect: Output is inert text or removed; no new element is created.
  core: true
- id: XSS-README-005
  class: mathml-injection-point
  payload: <math><mi//xlink:href="data:x,<script>alert(4)</script>">
  expect: The script inside the data URI is gone; no script element or executable href survives.
  core: true
- id: XSS-README-006
  class: rawtext-breakout
  payload: <TABLE><tr><td>HELLO</tr></TABL>
  expect: Malformed nesting is normalized to inert content; nothing executable is produced by parser repair.
  core: true
- id: XSS-CLASS-007
  class: mutation-xss-namespace
  payload: <svg><p><style><a id=</style><img src=x onerror=alert(1)>
  expect: 'The mutation XSS canonical case: namespace shuffling between SVG, style rawtext, and HTML must not resurrect the onerror after a serialize and reparse round trip.'
  core: true
- id: XSS-CLASS-008
  class: event-handler-basic
  payload: <img src=x onerror=alert(1)>
  expect: The img is removed or its onerror is stripped; this is the floor test every sanitizer passes or the review stops here.
  core: true
  also_in_upstream: test/bootstrap-test-suite.js
- id: XSS-CLASS-009
  class: uri-scheme
  payload: <a href="javascript:alert(1)">click</a>
  expect: 'The javascript: scheme does not survive in the href.'
  core: true
  also_in_upstream: test/test-suite.js
- id: XSS-CLASS-010
  class: form-action-scheme
  payload: <form><button formaction="javascript:alert(1)">go</button></form>
  expect: 'The formaction javascript: URL is removed or the element is stripped.'
  core: true
- id: XSS-CLASS-011
  class: details-event
  payload: <details open ontoggle=alert(1)>x</details>
  expect: The ontoggle handler is removed.
  core: true
- id: XSS-CLASS-012
  class: srcdoc
  payload: <iframe srcdoc="<script>alert(1)</script>"></iframe>
  expect: The iframe is removed or srcdoc is stripped; iframes allowed without srcdoc control are a config finding in their own right.
  core: true
- id: XSS-CLASS-013
  class: template-content
  payload: <template><img src=x onerror=alert(1)></template>
  expect: Template content is sanitized too, not skipped as inert; a sanitizer that ignores template contents fails this entry.
  core: true
  also_in_upstream: test/test-suite.js
