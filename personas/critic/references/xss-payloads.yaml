notes:
- Expect text states the invariant, not the exact output string; sanitizers differ in serialization, and the evidence is the invariant holding after a parse of the output, not byte equality.
- expected_upstream, where present, is DOMPurify's own expected sanitized output (or the acceptable set) from test/fixtures/expect.mjs, kept for reviewer context; the gate verdict uses the invariant, not byte comparison against it.
- Classification is heuristic (extract-corpus.mjs); per-class counts and the unclassified residue are reported in the lane report of the fix-all program.
