# cargo-deny configuration template (report L1-08).
# Copy to the project root as deny.toml and commit it.
# Every ignore below must carry an expiry comment in the project
# copy: an ignore without a date is a permanent blind spot.
[advisories]
# version = 2 (cargo-deny config format)
[licenses]
# The allowlist is a ceiling, not a checklist: allowances no
# current dependency uses warn instead of failing.
unused-allowed-license = "warn"
allow = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
[bans]
multiple-versions = "warn"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
